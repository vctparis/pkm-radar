name: Relevé quotidien

# Cardmarket et les marketplaces n'exposent pas ici 365 jours rétrospectifs :
# le job archive un point officiel par jour et laisse une piste d'audit.

on:
  schedule:
    # 06:12 UTC — décalé de l'heure pile, où les runners GitHub sont saturés
    # et les démarrages différés de plusieurs dizaines de minutes.
    - cron: "12 6 * * *"
  workflow_dispatch:

# Deux relevés simultanés se marcheraient dessus au moment du commit.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Vérifier les invariants avant relevé
        run: npm run test:data

      - name: Relever les marketplaces
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: node scripts/ingest.mjs

      # Une indisponibilité Cardmarket ne doit pas nous faire perdre le relevé
      # eBay/CardTrader du jour. On conserve le résultat partiel, puis on fait
      # échouer le job après le commit afin que l'alerte reste visible.
      - name: Relever le guide public Cardmarket
        id: cardmarket
        continue-on-error: true
        run: node scripts/ingest-cardmarket.mjs && node scripts/build-cardmarket-singles.mjs

      - name: Vérifier les artefacts du relevé
        run: npm run test:data

      - name: Commiter le relevé
        run: |
          git config user.name "pkm-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json data/cardmarket data/ledger public/radar-data.json public/cards-index.json public/drop-rate-v2.json public/card-tracker-index.json public/card-tracker public/market-pressure.json public/ledger-summary.json
          # Sans changement, `git commit` sort en erreur et ferait échouer le
          # job : une journée sans mouvement de prix est un cas normal.
          if git diff --staged --quiet; then
            echo "Aucun changement dans les relevés"
          else
            git commit -m "Relevé du $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Signaler une indisponibilité Cardmarket
        if: steps.cardmarket.outcome != 'success'
        run: exit 1
